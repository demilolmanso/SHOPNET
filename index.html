<!DOCTYPE html>
<html lang="es">

<title>Tienda Online</title>

<style>
:root{ --primary:#6d28d9; --accent:#f59e0b; --bg:#f2f3f9; --text:#191a23; --muted:#7b7e8f;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --err:#b91c1c; --errbg:#fee2e2; --used:#475569; --usedbg:#e2e8f0; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
img{display:block}
.splash,.splash-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash p,.splash-boot p{font-size:12px;letter-spacing:3px;font-weight:700;color:var(--muted)}
.spinner{width:44px;height:44px;border:4px solid #e5e6f2;border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--primary) 0%,#171226 135%)}
.login-card{background:#fff;border-radius:26px;padding:34px 26px;width:100%;max-width:380px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.login-logo{width:74px;height:74px;object-fit:contain;margin:0 auto 12px;border-radius:16px}
.login-emoji{font-size:56px;margin-bottom:8px}
.login-card h1{font-size:26px;font-weight:800}
.tagline{color:var(--muted);font-size:14px;margin-top:4px}
.login-text{font-size:14px;color:#444;margin:16px 0 22px;line-height:1.5}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;background:#fff;border:1.5px solid #e3e4ee;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(20,20,40,.08)}
.btn-google:active{transform:scale(.98)}
.login-note{font-size:12px;color:var(--muted);margin-top:16px}
.header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #ececf4}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;object-fit:contain}
.brand-emoji{font-size:26px}
.brand-name{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-admin{font-size:10px;font-weight:800;background:var(--primary);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:1px}
.user-menu{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);background:#e9e9f2}
.dropdown{position:absolute;right:0;top:48px;background:#fff;border-radius:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.25);padding:14px;width:230px;z-index:60;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.dd-name{font-weight:700;font-size:14px}
.dd-mail{font-size:12px;color:var(--muted);margin:2px 0 10px;word-break:break-all}
.dd-logout{width:100%;padding:10px;border-radius:10px;background:var(--errbg);color:var(--err);font-weight:700;font-size:13px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.banner{background:#fff7e0;border:1px solid #f5dfa8;color:#7a5b12;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 175%);border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:18px;box-shadow:0 14px 30px -14px var(--primary)}
.hero h2{font-size:21px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13.5px;opacity:.92;line-height:1.5}
.section-title{font-size:17px;font-weight:800;margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:44px 20px;background:#fff;border-radius:16px;line-height:1.8}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:379px){.prod-grid{grid-template-columns:1fr}}
.prod-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(25,26,35,.06);cursor:pointer;transition:transform .12s}
.prod-card:active{transform:scale(.98)}
.prod-img-wrap{position:relative;aspect-ratio:1/.78;background:#eee}
.prod-img{width:100%;height:100%;object-fit:cover}
.prod-img.ph{display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#eceafc,#f6efdc)}
.nostock{position:absolute;top:8px;left:8px;background:rgba(15,15,20,.78);color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:99px;letter-spacing:.5px}
.prod-body{padding:10px 12px 12px}
.prod-name{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--primary);background:rgba(0,0,0,.05);padding:3px 8px;border-radius:99px}
.prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-weight:800;font-size:15px}
.stock-lbl{font-size:11px;color:var(--muted);font-weight:600}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 22px -10px var(--primary)}
.btn-ghost{background:#f1f2f8;color:#4a4c5e;margin-top:9px}
.btn-mini{margin-top:9px;font-size:12px;font-weight:700;background:var(--primary);color:#fff;padding:8px 12px;border-radius:10px}
.overlay{position:fixed;inset:0;background:rgba(12,12,20,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:#e1e2ec;margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.input{width:100%;padding:13px 14px;border:1.5px solid #e5e6f0;border-radius:12px;font-size:15px;background:#fafaff;color:var(--text)}
.input:focus{outline:none;border-color:var(--primary);background:#fff}
textarea.input{resize:vertical}
.input.mini{width:86px;text-align:center}
.buy-resumen{display:flex;justify-content:space-between;align-items:center;background:#f7f7fc;border-radius:12px;padding:12px 14px;margin-bottom:6px}
.buy-resumen b{font-size:14px}
.buy-resumen .price{color:var(--primary)}
.det-img{width:100%;border-radius:16px;margin-bottom:14px;max-height:230px;object-fit:cover}
.det-img.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#eceafc,#f6efdc)}
.det-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.det-head h3{font-size:18px;font-weight:800}
.det-price{white-space:nowrap;color:var(--primary)}
.det-desc{font-size:13.5px;color:#555;line-height:1.55;margin:10px 0}
.det-stock{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:14px}
.pedido-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(25,26,35,.05);cursor:pointer}
.pedido-main{flex:1;min-width:0}
.pedido-nom{font-weight:700;font-size:14.5px}
.pedido-meta{font-size:12px;color:var(--muted);margin:3px 0 7px}
.pedido-qr{flex-shrink:0;background:#fff;border:1px solid #ececf4;border-radius:10px;padding:4px}
.qr-img{image-rendering:pixelated;border-radius:4px;background:#fff}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.badge-pend{background:var(--warnbg);color:var(--warn)}
.badge-rech{background:var(--errbg);color:var(--err)}
.badge-ok{background:var(--okbg);color:var(--ok)}
.badge-used{background:var(--usedbg);color:var(--used)}
.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ticket-store{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.ticket-prod{font-size:19px;font-weight:800;margin-bottom:14px}
.ticket-qr{display:flex;justify-content:center;padding:16px;background:#fafafd;border:1.5px dashed #d9dae8;border-radius:16px;margin-bottom:12px}
.qr-pending{padding:36px 12px;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.ticket-id{text-align:center;font-size:11px;color:var(--muted);font-family:monospace;letter-spacing:.5px;margin-bottom:14px;word-break:break-all}
.ticket-data{background:#f7f7fc;border-radius:14px;padding:6px 14px;margin-bottom:16px}
.trow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e9eaf3;font-size:13.5px}
.trow:last-child{border:none}
.trow span{color:var(--muted)}
.trow b{text-align:right;word-break:break-word}
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.subtab{flex:1;padding:11px;border-radius:12px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);box-shadow:0 3px 10px rgba(25,26,35,.05)}
.subtab.active{background:var(--primary);color:#fff}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(25,26,35,.05);margin-bottom:16px;overflow:hidden}
.card.pad{padding:18px}
.card-title{font-size:15.5px;font-weight:800;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.color-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
input[type=color]{width:64px;height:46px;border:1.5px solid #e5e6f0;border-radius:12px;background:#fafaff;padding:4px}
.list-title{font-size:14px;font-weight:800;margin:18px 0 10px;color:#3c3e4e}
.admin-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 3px 10px rgba(25,26,35,.05)}
.admin-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#f0f0f6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.admin-info{flex:1;min-width:0}
.admin-nom{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.btn-del{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--errbg);color:var(--err);font-size:15px;display:flex;align-items:center;justify-content:center}
.scanner-box{position:relative;border-radius:18px;overflow:hidden;background:#0d0d14;margin-bottom:14px;min-height:230px}
.scanner-video{width:100%;display:block;max-height:56vh;object-fit:cover}
.scanner-video.hidden{display:none}
.scanner-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8b8da3;font-size:14px;text-align:center;line-height:2}
.scan-result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;color:#fff}
.r-ok{background:rgba(21,128,61,.93)}
.r-usada{background:rgba(71,85,105,.94)}
.r-pendiente{background:rgba(180,83,9,.93)}
.r-invalido{background:rgba(185,28,28,.93)}
.scan-titulo{font-size:20px;font-weight:800}
.scan-msg{font-size:13.5px;opacity:.95}
.scan-det{font-size:12px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;margin-top:6px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #ececf4;display:flex;z-index:50;padding:7px 6px calc(9px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:#9a9db0;font-size:10.5px;font-weight:700;border-radius:12px}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:23px;height:23px}
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{color:#fff;font-size:13.5px;font-weight:600;padding:13px 16px;border-radius:13px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:pop .2s ease;line-height:1.4}
.t-success{background:var(--ok)} .t-error{background:var(--err)} .t-info{background:#1d1e2a}
</style>
</head>

function QRImg({ value, size }) {
  const ref = useRef(null);
  useEffect(() => {
    let cancel = false;
    if (window.QRCode && ref.current) {
      QRCode.toDataURL(value, { width: size * 2, margin: 1, color: { dark: '#16161d' } })
        .then(url => { if (!cancel && ref.current) ref.current.src = url; }).catch(() => {});
    }
    return () => { cancel = true; };
  }, [value, size]);
  return <img ref={ref} width={size} height={size} className="qr-img" alt="QR"/>;
}

function CompraModal({ producto, config, user, onClose, toast }) {
  const [nombre, setNombre] = useState(user.displayName || '');
  const [dni, setDni] = useState('');
  const [busy, setBusy] = useState(false);
  const pagar = async () => {
    if (!nombre.trim() || !dni.trim()) return toast('Completá tu Nombre Completo y DNI.', 'error');
    if (producto.stock <= 0) return toast('Sin stock disponible.', 'error');
    setBusy(true);
    try {
      const ref = await db.collection('pedidos').add({
        productoId: producto.id || null,
        productoNombre: producto.nombre,
        precio: Number(producto.precio),
        nombre: nombre.trim(), dni: dni.trim(),
        userId: user.uid, userEmail: user.email,
        estado: 'pendiente',
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      });
      const pref = await crearPreferencia(buildPreferencia({
        titulo: producto.nombre, precio: producto.precio, ref: ref.id,
        nombre: nombre.trim(), dni: dni.trim(), email: user.email, config
      }));
      const url = pref.init_point || pref.sandbox_init_point;
      if (!url) throw new Error('Mercado Pago no devolvió un link de pago.');
      toast('Redirigiendo a Mercado Pago…', 'info');
      window.location.href = url;
    } catch (e) {
      toast('Error al iniciar el pago: ' + e.message, 'error');
      setBusy(false);
    }
  };
  return (
    <div className="overlay" onClick={busy ? null : onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle"/>
        <h3 className="sheet-title">🛒 Finalizar compra</h3>
        <div className="buy-resumen">
          <b>{producto.nombre}</b>
          <span className="price">{money(producto.precio, config)}</span>
        </div>
        <label>Nombre Completo</label>
        <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Como figura en tu documento"/>
        <label>DNI / Documento</label>
        <input className="input" inputMode="numeric" value={dni} onChange={e => setDni(e.target.value)} placeholder="Solo números"/>
        <button className="btn btn-primary" style={{marginTop:'18px'}} onClick={pagar} disabled={busy}>
          {busy ? 'Conectando con Mercado Pago…' : '💳 Pagar con Mercado Pago'}
        </button>
        <button className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancelar</button>
      </div>
    </div>
  );
}

  const vacio = { nombre:'', precio:'', stock:'', categoria:'', imagenUrl:'', descripcion:'' };

  const [saving, setSaving] = useState(false);

  const crear = async () => {
    if (!f.nombre.trim() || !f.precio) return toast('Nombre y precio son obligatorios.', 'error');
    setSaving(true);
    try {
      await db.collection('productos').add({
        nombre: f.nombre.trim(), descripcion: f.descripcion.trim(),
        categoria: f.categoria.trim(), imagenUrl: f.imagenUrl.trim(),
        precio: parseFloat(f.precio) || 0, stock: parseInt(f.stock) || 0,

        </div>

        <input className="input" value={f.categoria} onChange={e => set('categoria', e.target.value)}/>
        <label>URL de imagen</label>

function ScannerView({ toast }) {
  const videoRef = useRef(null), canvasRef = useRef(null), streamRef = useRef(null), rafRef = useRef(null);
  const activeRef = useRef(false);
  const [activo, setActivo] = useState(false);
  const [resultado, setResultado] = useState(null);

  useEffect(() => () => { activeRef.current = false; if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); }, []);

  const escanear = () => {
    if (!activeRef.current) return;
    const video = videoRef.current, canvas = canvasRef.current;
    if (video && video.readyState === video.HAVE_ENOUGH_DATA && canvas) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height);
      if (code && code.data) { procesar(code.data); return; }
    }
    rafRef.current = requestAnimationFrame(escanear);
  };

  const activar = async () => {
    setResultado(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      streamRef.current = stream;
      const video = videoRef.current;
      video.srcObject = stream;
      await video.play();
      activeRef.current = true; setActivo(true);
      escanear();
    } catch (e) { toast('❌ No se pudo acceder a la cámara. Revisá los permisos.', 'error'); }
  };

  const detener = () => {
    activeRef.current = false;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    streamRef.current = null;
    setActivo(false);
  };

  const procesar = async (raw) => {
    activeRef.current = false;
    const id = raw.indexOf(QR_PREFIX) === 0 ? raw.slice(QR_PREFIX.length) : raw.trim();
    try {
      const snap = await db.collection('pedidos').doc(id).get();
      if (!snap.exists) return setResultado({ tipo:'invalido', titulo:'❌ Ticket inválido', msg:'Este código no existe en la base de datos.' });
      const p = snap.data();
      if (p.estado === 'entregado') return setResultado({ tipo:'usada', titulo:'⚠️ Ya entregado', msg:'Entregado el ' + fmtFecha(p.entregadoEl), p });
      if (p.estado === 'pendiente') return setResultado({ tipo:'pendiente', titulo:'⏳ Pago pendiente', msg:'El pago aún no fue aprobado. No entregar.', p });
      if (p.estado === 'rechazado') return setResultado({ tipo:'invalido', titulo:'❌ Pago rechazado', msg:'El pago fue rechazado. No entregar.', p });
      await db.collection('pedidos').doc(id).update({ estado:'entregado', entregadoEl: firebase.firestore.FieldValue.serverTimestamp() });
      if (navigator.vibrate) navigator.vibrate(120);
      setResultado({ tipo:'ok', titulo:'✅ Entrega confirmada', msg:'Pedido validado y marcado como entregado.', p });
    } catch (e) {
      setResultado({ tipo:'invalido', titulo:'Error de red', msg:'Reintentá el escaneo.' });
    }
  };

  return (
    <div>
      <h3 className="section-title">📷 Escáner de Pedidos</h3>
      <p className="hint">Escaneá el QR del pedido para validar y marcar la entrega automáticamente.</p>
      <div className="scanner-box">
        <video ref={videoRef} playsInline muted className={'scanner-video' + (activo ? '' : ' hidden')}/>
        {!activo && !resultado && <div className="scanner-ph">📷<br/>La cámara se activará aquí</div>}
        {resultado && (
          <div className={'scan-result r-' + resultado.tipo}>
            <div className="scan-titulo">{resultado.titulo}</div>
            <div className="scan-msg">{resultado.msg}</div>
            {resultado.p && <div className="scan-det">{resultado.p.productoNombre} · {resultado.p.nombre} · DNI {resultado.p.dni}</div>}
          </div>
        )}
      </div>
      <canvas ref={canvasRef} style={{display:'none'}}/>
      {activo ? (
        <div>
          <button className="btn btn-primary" onClick={() => { setResultado(null); activeRef.current = true; escanear(); }}>🔁 Escanear otro</button>
          <button className="btn btn-ghost" onClick={detener}>Detener cámara</button>
        </div>
      ) : (
        <button className="btn btn-primary" onClick={activar}>📸 Activar Cámara</button>
      )}
    </div>
  );
}

function App() {
  const [booting, setBooting] = useState(true);
  const [bootError, setBootError] = useState(false);
  const [user, setUser] = useState(null);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [tab, setTab] = useState('tienda');
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [todosPedidos, setTodosPedidos] = useState([]);
  const [comprando, setComprando] = useState(null);
  const [toasts, setToasts] = useState([]);

  const isAdmin = !!(user && ADMIN_EMAIL && user.email && user.email.toLowerCase() === String(ADMIN_EMAIL).toLowerCase());

  const toast = (msg, type) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type: type || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
  };

  useEffect(() => {
    if (!auth) { setBooting(false); return; }
    let done = false;
    const unsub = auth.onAuthStateChanged(u => { done = true; setUser(u); setBooting(false); });
    const t = setTimeout(() => { if (!done) setBootError(true); }, 10000);
    return () => { clearTimeout(t); unsub(); };
  }, []);

  useEffect(() => {
    if (!db) return;
    return db.collection('config').doc('store').onSnapshot(snap => {
      setConfig(Object.assign({}, DEFAULT_CONFIG, snap.exists ? snap.data() : {}));
    }, () => {});
  }, []);

  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--primary', config.primaryColor || '#6d28d9');
    r.setProperty('--accent', config.accentColor || '#f59e0b');
    document.title = config.title || 'Tienda Online';
  }, [config]);

  useEffect(() => {
    if (!db || !user) { setProductos([]); return; }
    return db.collection('productos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => (b.creadoEl || 0) - (a.creadoEl || 0));
      setProductos(arr);
    }, e => toast('Error al cargar productos: ' + e.message, 'error'));
  }, [user]);

  useEffect(() => {
    if (!db || !user) { setPedidos([]); return; }
    return db.collection('pedidos').where('userId', '==', user.uid).onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => tsNum(b.fecha) - tsNum(a.fecha));
      setPedidos(arr);
    }, () => {});
  }, [user]);

  useEffect(() => {
    if (!db || !isAdmin) { setTodosPedidos([]); return; }
    return db.collection('pedidos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => tsNum(b.fecha) - tsNum(a.fecha));
      setTodosPedidos(arr);
    }, () => {});
  }, [isAdmin]);

  useEffect(() => { if (!user) { setTab('tienda'); setComprando(null); } }, [user]);

  useEffect(() => {
    if (booting || !db) return;
    const params = new URLSearchParams(window.location.search);
    const ext = params.get('external_reference');
    const status = params.get('collection_status') || params.get('status');
    if (!ext || !status) return;
    window.history.replaceState({}, '', window.location.pathname);
    (async () => {
      try {
        const ref = db.collection('pedidos').doc(ext);
        const snap = await ref.get();
        if (!snap.exists) return;
        const p = snap.data();
        if (status === 'approved') {
          if (p.estado === 'pendiente' || p.estado === 'rechazado') {
            await ref.update({ estado: 'aprobado', pagadoEl: firebase.firestore.FieldValue.serverTimestamp() });
            if (p.productoId) {
              try {
                await db.runTransaction(async t => {
                  const pr = db.collection('productos').doc(p.productoId);
                  const ps = await t.get(pr);
                  if (ps.exists) t.update(pr, { stock: Math.max(0, (ps.data().stock || 1) - 1) });
                });
              } catch (e) {}
            }
          }
          toast('✅ ¡Pago aprobado! Tu pedido ya está en Mis Pedidos.', 'success');
          setTab('pedidos');
        } else if (status === 'pending' || status === 'in_process' || status === 'authorized') {
          toast('⏳ El pago quedó pendiente. Lo verás en Mis Pedidos.', 'info');
          setTab('pedidos');
        } else {
          if (p.estado === 'pendiente') await ref.update({ estado: 'rechazado' });
          toast('❌ El pago fue rechazado o cancelado.', 'error');
        }
      } catch (e) { toast('No se pudo verificar el pago: ' + e.message, 'error'); }
    })();
  }, [booting]);

  const reintentarPago = async (pedido) => {
    try {
      toast('⏳ Generando link de pago…', 'info');
      const pref = await crearPreferencia(buildPreferencia({
        titulo: pedido.productoNombre, precio: pedido.precio, ref: pedido.id,
        nombre: pedido.nombre, dni: pedido.dni, email: user.email, config
      }));
      const url = pref.init_point || pref.sandbox_init_point;
      if (!url) throw new Error('Sin link de pago.');
      window.location.href = url;
    } catch (e) { toast('❌ ' + e.message, 'error'); }
  };

  if (!CREDS_OK || FB_ERROR || !auth) return (<><CredsScreen fbError={FB_ERROR}/><Toasts toasts={toasts}/></>);
  if (booting) return (<><Splash error={bootError}/><Toasts toasts={toasts}/></>);
  if (!user) return (<><Login config={config}/><Toasts toasts={toasts}/></>);

  return (
    <div>
      <Header user={user} config={config} isAdmin={isAdmin}/>
      <main className="app">
        {config.banner && <div className="banner">📣 {config.banner}</div>}
        {tab === 'tienda' && <TiendaView productos={productos} config={config} onComprar={setComprando} toast={toast}/>}
        {tab === 'pedidos' && <PedidosView pedidos={pedidos} config={config} onPagar={reintentarPago}/>}
        {tab === 'admin' && isAdmin && <AdminView config={config} productos={productos} pedidos={todosPedidos} toast={toast}/>}
        {tab === 'scanner' && isAdmin && <ScannerView toast={toast}/>}
      </main>
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin}/>
      {comprando && <CompraModal producto={comprando} config={config} user={user} onClose={() => setComprando(null)} toast={toast}/>}
      <Toasts toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
window.__APP_RENDERED__ = true;
</script>
</body>
</html>
