<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>BloodLucyfer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='40' y='5' width='20' height='90' fill='%23dc2626'/><rect x='15' y='65' width='70' height='18' fill='%23dc2626'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --primary:#dc2626;
  --primary-dark:#7f1d1d;
  --accent:#ef4444;
  --bg:#050505;
  --bg-card:#121212;
  --bg-elev:#1a1a1a;
  --border:#2a2a2a;
  --text:#e5e5e5;
  --muted:#7a7a7a;
  --ok:#22c55e; --okbg:rgba(34,197,94,.15);
  --warn:#eab308; --warnbg:rgba(234,179,8,.15);
  --err:#ef4444; --errbg:rgba(239,68,68,.15);
  --used:#94a3b8; --usedbg:rgba(148,163,184,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
img{display:block}

/* ══════════ SPLASH / BOOT ══════════ */
.splash,.splash-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash p,.splash-boot p{font-size:12px;letter-spacing:3px;font-weight:700;color:var(--primary);text-transform:uppercase}
.spinner{width:44px;height:44px;border:4px solid #1a1a1a;border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════ LOGIN ══════════ */
.login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at top,#1a0000 0%,#050505 70%);
}
.login-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:26px;
  padding:34px 26px;width:100%;max-width:380px;text-align:center;
  box-shadow:0 30px 60px -20px rgba(220,38,38,.3),inset 0 0 40px rgba(127,29,29,.15);
}
.login-logo{width:74px;height:74px;object-fit:contain;margin:0 auto 12px;border-radius:16px}
.login-emoji{font-size:56px;margin-bottom:8px;color:var(--primary)}
.login-card h1{
  font-size:32px;font-weight:900;font-family:'Cinzel',serif;letter-spacing:3px;
  color:var(--primary);text-shadow:0 0 15px rgba(220,38,38,.6);text-transform:uppercase;
}
.tagline{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:1px}
.login-text{font-size:13.5px;color:#999;margin:16px 0 22px;line-height:1.6}
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:14px;border-radius:14px;background:#0a0a0a;border:1.5px solid var(--primary);
  font-weight:700;font-size:15px;color:var(--primary);
  box-shadow:0 4px 20px rgba(220,38,38,.2);transition:all .15s;
}
.btn-google:hover{background:var(--primary-dark);color:#fff}
.btn-google:active{transform:scale(.98)}
.login-note{font-size:12px;color:var(--muted);margin-top:16px}

/* ══════════ HEADER ══════════ */
.header{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;object-fit:contain}
.brand-emoji{font-size:26px;color:var(--primary)}
.brand-name{
  font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'Cinzel',serif;letter-spacing:1.5px;color:var(--primary);
  text-shadow:0 0 8px rgba(220,38,38,.5);
}
.chip-admin{font-size:10px;font-weight:800;background:var(--primary);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:1px;box-shadow:0 0 8px var(--primary)}
.user-menu{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);box-shadow:0 0 10px rgba(220,38,38,.4);background:#1a1a1a}
.dropdown{
  position:absolute;right:0;top:48px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);padding:14px;width:230px;z-index:60;animation:pop .15s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.dd-name{font-weight:700;font-size:14px;color:var(--text)}
.dd-mail{font-size:12px;color:var(--muted);margin:2px 0 10px;word-break:break-all}
.dd-logout{width:100%;padding:10px;border-radius:10px;background:var(--errbg);color:var(--err);font-weight:700;font-size:13px;border:1px solid rgba(239,68,68,.3)}

/* ══════════ APP / BANNER / HERO ══════════ */
.app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.banner{
  background:rgba(127,29,29,.3);border:1px solid var(--primary-dark);color:var(--accent);
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
}
.hero{
  background:linear-gradient(135deg,#0a0000 0%,#1a0505 60%,#2a0a0a 100%);
  border:1px solid var(--primary-dark);border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:18px;
  box-shadow:0 14px 30px -14px rgba(220,38,38,.5),inset 0 0 30px rgba(127,29,29,.2);
}
.hero h2{
  font-size:24px;font-weight:900;margin-bottom:6px;
  font-family:'Cinzel',serif;letter-spacing:2px;color:var(--primary);
  text-shadow:0 0 12px rgba(220,38,38,.7);
}
.hero p{font-size:13.5px;color:#aaa;line-height:1.5}
.section-title{
  font-size:16px;font-weight:900;margin:6px 0 12px;
  font-family:'Cinzel',serif;letter-spacing:2px;color:var(--primary);
  text-shadow:0 0 6px rgba(220,38,38,.4);text-transform:uppercase;
}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:44px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;line-height:1.8}

/* ══════════ PRODUCTS ══════════ */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:379px){.prod-grid{grid-template-columns:1fr}}
.prod-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.5);cursor:pointer;transition:all .2s;
}
.prod-card:hover{border-color:var(--primary);box-shadow:0 4px 30px rgba(220,38,38,.3)}
.prod-card:active{transform:scale(.98)}
.prod-img-wrap{position:relative;aspect-ratio:1/.78;background:#0a0a0a}
.prod-img{width:100%;height:100%;object-fit:cover}
.prod-img.ph{display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#1a1a1a,#0a0a0a);color:var(--primary)}
.nostock{position:absolute;top:8px;left:8px;background:rgba(5,5,5,.9);color:var(--err);font-size:10px;font-weight:700;padding:4px 9px;border-radius:99px;letter-spacing:.5px;border:1px solid var(--primary-dark)}
.prod-body{padding:10px 12px 12px}
.prod-name{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.chip{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(220,38,38,.1);padding:3px 8px;border-radius:99px;border:1px solid var(--primary-dark)}
.prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-weight:800;font-size:15px;color:var(--primary)}
.stock-lbl{font-size:11px;color:var(--muted);font-weight:600}

/* ══════════ BUTTONS ══════════ */
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;transition:all .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;box-shadow:0 10px 22px -10px var(--primary),0 0 15px rgba(220,38,38,.3);
}
.btn-primary:hover{box-shadow:0 10px 30px -10px var(--primary),0 0 25px rgba(220,38,38,.5)}
.btn-ghost{background:#1a1a1a;color:var(--muted);margin-top:9px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--text)}
.btn-mini{margin-top:9px;font-size:12px;font-weight:700;background:var(--primary-dark);color:#fff;padding:8px 12px;border-radius:10px;border:1px solid var(--primary)}

/* ══════════ OVERLAY / SHEET ══════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{
  background:var(--bg-card);border-top:1px solid var(--primary-dark);
  width:100%;max-width:560px;border-radius:26px 26px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px;border:1px solid var(--border)}}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:var(--primary-dark);margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--primary);font-family:'Cinzel',serif;letter-spacing:1px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.input{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;background:#0a0a0a;color:var(--text);
}
.input:focus{outline:none;border-color:var(--primary);background:#050505;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
textarea.input{resize:vertical}
.input.mini{width:86px;text-align:center}

.buy-resumen{display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.buy-resumen b{font-size:14px;color:var(--text)}
.buy-resumen .price{color:var(--primary)}

.det-img{width:100%;border-radius:16px;margin-bottom:14px;max-height:230px;object-fit:cover;border:1px solid var(--border)}
.det-img.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#1a1a1a,#0a0a0a);color:var(--primary)}
.det-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.det-head h3{font-size:18px;font-weight:800;color:var(--text)}
.det-price{white-space:nowrap;color:var(--primary);font-weight:800;font-size:18px}
.det-desc{font-size:13.5px;color:#999;line-height:1.55;margin:10px 0}
.det-stock{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:14px}

/* ══════════ PEDIDOS / TICKET ══════════ */
.pedido-card{
  display:flex;align-items:center;gap:12px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);cursor:pointer;transition:all .15s;
}
.pedido-card:hover{border-color:var(--primary-dark)}
.pedido-main{flex:1;min-width:0}
.pedido-nom{font-weight:700;font-size:14.5px;color:var(--text)}
.pedido-meta{font-size:12px;color:var(--muted);margin:3px 0 7px}
.pedido-qr{flex-shrink:0;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:4px}
.qr-img{image-rendering:pixelated;border-radius:4px;background:#fff}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.badge-pend{background:var(--warnbg);color:var(--warn);border:1px solid rgba(234,179,8,.3)}
.badge-rech{background:var(--errbg);color:var(--err);border:1px solid rgba(239,68,68,.3)}
.badge-ok{background:var(--okbg);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.badge-used{background:var(--usedbg);color:var(--used);border:1px solid rgba(148,163,184,.3)}

.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ticket-store{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-family:'Cinzel',serif}
.ticket-prod{font-size:19px;font-weight:800;margin-bottom:14px;color:var(--text)}
.ticket-qr{display:flex;justify-content:center;padding:16px;background:#0a0a0a;border:1.5px dashed var(--primary-dark);border-radius:16px;margin-bottom:12px}
.qr-pending{padding:36px 12px;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.ticket-id{text-align:center;font-size:11px;color:var(--muted);font-family:monospace;letter-spacing:.5px;margin-bottom:14px;word-break:break-all}
.ticket-data{background:#0a0a0a;border:1px solid var(--border);border-radius:14px;padding:6px 14px;margin-bottom:16px}
.trow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.trow:last-child{border:none}
.trow span{color:var(--muted)}
.trow b{text-align:right;word-break:break-word;color:var(--text)}

/* ══════════ ADMIN ══════════ */
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.subtab{flex:1;padding:11px;border-radius:12px;background:var(--bg-card);font-weight:700;font-size:13px;color:var(--muted);box-shadow:0 3px 10px rgba(0,0,0,.4);border:1px solid var(--border);transition:all .15s}
.subtab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 15px rgba(220,38,38,.4)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.4);margin-bottom:16px;overflow:hidden}
.card.pad{padding:18px}
.card-title{font-size:15.5px;font-weight:800;margin-bottom:6px;color:var(--primary);font-family:'Cinzel',serif;letter-spacing:1px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.color-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
input[type=color]{width:64px;height:46px;border:1.5px solid var(--border);border-radius:12px;background:#0a0a0a;padding:4px}
.list-title{font-size:14px;font-weight:800;margin:18px 0 10px;color:var(--accent);font-family:'Cinzel',serif;letter-spacing:1px;text-transform:uppercase}
.admin-row{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.admin-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#0a0a0a;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border);color:var(--primary)}
.admin-info{flex:1;min-width:0}
.admin-nom{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.admin-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.btn-del{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--errbg);color:var(--err);font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(239,68,68,.3)}

/* ══════════ SCANNER ══════════ */
.scanner-box{position:relative;border-radius:18px;overflow:hidden;background:#0d0d14;border:1px solid var(--primary-dark);margin-bottom:14px;min-height:230px}
.scanner-video{width:100%;display:block;max-height:56vh;object-fit:cover}
.scanner-video.hidden{display:none}
.scanner-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;line-height:2}
.scan-result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;color:#fff}
.r-ok{background:rgba(21,128,61,.93)}
.r-usada{background:rgba(71,85,105,.94)}
.r-pendiente{background:rgba(180,83,9,.93)}
.r-invalido{background:rgba(185,28,28,.93)}
.scan-titulo{font-size:20px;font-weight:800;font-family:'Cinzel',serif;letter-spacing:1px}
.scan-msg{font-size:13.5px;opacity:.95}
.scan-det{font-size:12px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;margin-top:6px}

/* ══════════ BOTTOM NAV ══════════ */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:rgba(5,5,5,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);
  display:flex;z-index:50;padding:7px 6px calc(9px + env(safe-area-inset-bottom));
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px;transition:all .15s}
.nav-item.active{color:var(--primary);text-shadow:0 0 8px rgba(220,38,38,.5)}
.nav-item svg{width:23px;height:23px}

/* ══════════ TOASTS ══════════ */
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{color:#fff;font-size:13.5px;font-weight:600;padding:13px 16px;border-radius:13px;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);animation:pop .2s ease;line-height:1.4;border:1px solid transparent}
.t-success{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.t-error{background:var(--errbg);border-color:var(--err);color:var(--err)}
.t-info{background:#121212;border-color:var(--border);color:var(--text)}

/* ══════════ VORTEX BACKGROUND ══════════ */
.vortex-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:#050505;
}

/* Scrollbar custom */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:var(--primary-dark);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
</style>
</head>
<body>
<div id="root"><div class="splash-boot"><div class="spinner"></div><p>ABRIENDO LAS PUERTAS DEL INFIERNO...</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
/* ══ Vigilante de arranque ══ */
window.__BOOT__ = {};
window.addEventListener('error', function (e) { window.__BOOT__.error = e.message || 'Error desconocido'; });
setTimeout(function () {
  if (window.__APP_RENDERED__) return;
  var box = document.getElementById('root'); if (!box) return;
  var msg;
  if (window.__BOOT__.error) msg = 'Error de JavaScript:<br><b>' + window.__BOOT__.error + '</b>';
  else if (!window.__APP_STARTED__) msg = 'No cargaron las librerías (CDN). Revisá tu conexión / bloqueador y recargá.';
  else msg = 'Firebase no respondió. Revisá las credenciales al inicio del script de la app.';
  box.innerHTML = '<div class="splash-boot" style="padding:24px;text-align:center">' +

/* ══════════ TYPHOGRAPHY VORTEX (Optimizado, 30 FPS, 10 anillos) ══════════ */
function VortexBackground() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const wordsRef = useRef([
    "IN NOMINE DEI NOSTRI SATANAS LUCIFERI EXCELSI",
    "AVE SATANAS", "REX MUNDI", "INFERNUM", "ABYSSUS",
    "TENEBRAE", "MORS AETERNA", "IGNIS INFERNALIS",
    "SANGUIS", "CRUOR", "LUCIFER", "BAPHOMET",
    "AD PORTAS INFERI", "NOX AETERNA", "DIES IRAE"
  ]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height, MAX_RADIUS;
    const rings = [];
    const NUM_RINGS = 10;
    const words = wordsRef.current;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      MAX_RADIUS = Math.sqrt(width * width + height * height) / 2;
      rings.length = 0;
      for (let i = 0; i < NUM_RINGS; i++) {
        rings.push({
          radius: (MAX_RADIUS / NUM_RINGS) * i,
          rotation: Math.random() * Math.PI * 2,
          speed: (Math.random() * 0.0012 + 0.0004) * (Math.random() > 0.5 ? 1 : -1),
          wordIndex: Math.floor(Math.random() * words.length),
          opacity: Math.max(0.15, 1 - (i / NUM_RINGS) * 0.85)
        });
      }
    }

    resize();
    window.addEventListener('resize', resize);

    let lastTime = 0;
    const FPS_INTERVAL = 1000 / 30; // 30 FPS — balance visual/rendimiento

    function draw(currentTime) {
      rafRef.current = requestAnimationFrame(draw);
      const elapsed = currentTime - lastTime;
      if (elapsed < FPS_INTERVAL) return;
      lastTime = currentTime - (elapsed % FPS_INTERVAL);

      // Fondo negro profundo
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, width, height);

      // Viñeta radial para dar sensación de túnel
      const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, MAX_RADIUS);
      grad.addColorStop(0, 'rgba(30,0,0,0.0)');
      grad.addColorStop(0.7, 'rgba(5,5,5,0.4)');
      grad.addColorStop(1, 'rgba(5,5,5,0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      ctx.font = 'bold 14px "Inter", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];
        ring.radius += 0.7;
        ring.rotation += ring.speed;

        if (ring.radius > MAX_RADIUS) {
          ring.radius = 5;
          ring.wordIndex = Math.floor(Math.random() * words.length);
        }

        if (ring.radius < 15) continue;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ring.rotation);

        const word = words[ring.wordIndex];
        const sep = '  †  ';
        const text = word + sep + word + sep;
        const radius = ring.radius;
        const charAngle = (Math.PI * 2) / text.length;
        const alpha = ring.opacity;

        // Glow rojo sangre
        ctx.shadowColor = `rgba(220, 38, 38, ${alpha})`;
        ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(220, 38, 38, ${alpha})`;

        for (let i = 0; i < text.length; i++) {
          ctx.save();
          ctx.rotate(i * charAngle);
          ctx.translate(0, -radius);
          ctx.rotate(Math.PI / 2);
          ctx.fillText(text[i], 0, 0);
          ctx.restore();
        }

        ctx.restore();
      }
    }

    rafRef.current = requestAnimationFrame(draw);

    return () => {
      window.removeEventListener('resize', resize);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return <canvas ref={canvasRef} className="vortex-bg"/>;
}

    try {
      await db.collection('config').doc('store').set(f, { merge: true });
      toast('✅ Pacto guardado en las tinieblas.', 'success');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
    setSaving(false);
  };
  return (
    <div className="card pad">
      <h4 className="card-title">🕯️ Apariencia del Reino</h4>
      <p className="hint">Personalizá el nombre, la presentación y los colores. Los cambios se aplican al instante.</p>
      <label>Título del Dominio</label>
      <input className="input" value={f.title} onChange={e => set('title', e.target.value)}/>
      <label>Lema / subtítulo</label>
      <input className="input" value={f.tagline} onChange={e => set('tagline', e.target.value)}/>
      <label>Título de bienvenida (portada)</label>
      <input className="input" value={f.heroTitle} onChange={e => set('heroTitle', e.target.value)}/>
      <label>Texto de presentación</label>
      <textarea className="input" rows="3" value={f.heroText} onChange={e => set('heroText', e.target.value)}/>
      <label>URL del logo (imagen)</label>
      <input className="input" placeholder="https://…" value={f.logoUrl} onChange={e => set('logoUrl', e.target.value)}/>
      <label>Banner / anuncio (opcional)</label>
      <input className="input" placeholder="Ej: Ofrendas gratis esta luna 🌑" value={f.banner} onChange={e => set('banner', e.target.value)}/>
      <div className="color-row">
        <div><label>Color primario</label><input type="color" value={f.primaryColor} onChange={e => set('primaryColor', e.target.value)}/></div>
        <div><label>Color acento</label><input type="color" value={f.accentColor} onChange={e => set('accentColor', e.target.value)}/></div>
        <div><label>Símbolo $</label><input className="input mini" value={f.currencySymbol} onChange={e => set('currencySymbol', e.target.value)}/></div>
        <div><label>Código MP</label><input className="input mini" value={f.currency} onChange={e => set('currency', e.target.value.toUpperCase())}/></div>
      </div>
      <button className="btn btn-primary" style={{marginTop:'16px'}} onClick={guardar} disabled={saving}>
        {saving ? 'Invocando…' : '🩸 Guardar pacto'}
      </button>
    </div>
  );
}

function GestionProductos({ productos, pedidos, toast, config }) {
  const vacio = { nombre:'', precio:'', stock:'', categoria:'', imagenUrl:'', descripcion:'' };
  const [f, setF] = useState(vacio);
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  const crear = async () => {
    if (!f.nombre.trim() || !f.precio) return toast('Nombre y precio son obligatorios.', 'error');
    setSaving(true);
    try {
      await db.collection('productos').add({
        nombre: f.nombre.trim(), descripcion: f.descripcion.trim(),
        categoria: f.categoria.trim(), imagenUrl: f.imagenUrl.trim(),
        precio: parseFloat(f.precio) || 0, stock: parseInt(f.stock) || 0,
        creadoEl: Date.now()
      });
      toast('✅ Artefacto invocado.', 'success');
      setF(vacio);
    } catch (e) { toast('Error: ' + e.message, 'error'); }
    setSaving(false);
  };
  const borrar = async (p) => {
    if (!confirm('¿Desterrar permanentemente "' + p.nombre + '"?')) return;
    try { await db.collection('productos').doc(p.id).delete(); toast('🗑️ Artefacto desterrado.', 'success'); }
    catch (e) { toast('Error: ' + e.message, 'error'); }
  };
  return (
    <div>
      <div className="card pad">
        <h4 className="card-title">➕ Invocar Nuevo Artefacto</h4>
        <p className="hint">La API de Mercado Pago generará los links de pago automáticamente.</p>
        <label>Nombre del artefacto *</label>
        <input className="input" value={f.nombre} onChange={e => set('nombre', e.target.value)}/>
        <div className="color-row">
          <div style={{flex:1}}><label>Ofrenda *</label><input className="input" type="number" min="0" value={f.precio} onChange={e => set('precio', e.target.value)}/></div>
          <div style={{flex:1}}><label>Almas en stock</label><input className="input" type="number" min="0" value={f.stock} onChange={e => set('stock', e.target.value)}/></div>
        </div>
        <label>Categoría</label>
        <input className="input" value={f.categoria} onChange={e => set('categoria', e.target.value)}/>
        <label>URL de imagen</label>
        <input className="input" placeholder="https://…" value={f.imagenUrl} onChange={e => set('imagenUrl', e.target.value)}/>
        <label>Descripción</label>
        <textarea className="input" rows="3" value={f.descripcion} onChange={e => set('descripcion', e.target.value)}/>
        <button className="btn btn-primary" style={{marginTop:'14px'}} onClick={crear} disabled={saving}>
          {saving ? 'Invocando…' : 'Invocar Artefacto'}
        </button>
      </div>

      <h4 className="list-title">Artefactos publicados ({productos.length})</h4>
      {productos.length === 0 && <div className="empty">Todavía no invocaste artefactos.</div>}
      {productos.map(p => (
        <div className="admin-row" key={p.id}>
          {p.imagenUrl ? <img className="admin-thumb" src={p.imagenUrl} alt=""/> : <div className="admin-thumb"><InvertedCross size={24}/></div>}
          <div className="admin-info">
            <div className="admin-nom">{p.nombre}</div>
            <div className="admin-meta">{money(p.precio, config)} · Stock: {p.stock}</div>
          </div>
          <button className="btn-del" onClick={() => borrar(p)}>✕</button>
        </div>
      ))}

      <h4 className="list-title">Pactos recibidos ({pedidos.length})</h4>
      {pedidos.length === 0 && <div className="empty">Aún no hay pactos.</div>}
      {pedidos.slice(0, 40).map(p => (
        <div className="admin-row" key={p.id}>
          <div className="admin-thumb">📜</div>
          <div className="admin-info">
            <div className="admin-nom">{p.productoNombre}</div>
            <div className="admin-meta">{p.nombre} · {money(p.precio, config)} · {fmtFecha(p.fecha)}</div>
          </div>
          <Badge estado={p.estado}/>
        </div>
      ))}
    </div>
  );
}

function AdminView({ config, productos, pedidos, toast }) {
  const [sub, setSub] = useState('productos');
  return (
    <div>
      <h3 className="section-title">👑 Dominio del Señor</h3>
      <div className="subtabs">
        <button className={sub === 'productos' ? 'subtab active' : 'subtab'} onClick={() => setSub('productos')}>Artefactos y Pactos</button>
        <button className={sub === 'apariencia' ? 'subtab active' : 'subtab'} onClick={() => setSub('apariencia')}>Apariencia</button>
      </div>
      {sub === 'productos'
        ? <GestionProductos productos={productos} pedidos={pedidos} toast={toast} config={config}/>
        : <ConfigTienda config={config} toast={toast}/>}
    </div>
  );
}

function ScannerView({ toast }) {
  const videoRef = useRef(null), canvasRef = useRef(null), streamRef = useRef(null), rafRef = useRef(null);
  const activeRef = useRef(false);
  const [activo, setActivo] = useState(false);
  const [resultado, setResultado] = useState(null);

  useEffect(() => () => { activeRef.current = false; if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); }, []);

  const escanear = () => {
    if (!activeRef.current) return;
    const video = videoRef.current, canvas = canvasRef.current;
    if (video && video.readyState === video.HAVE_ENOUGH_DATA && canvas) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height);
      if (code && code.data) { procesar(code.data); return; }
    }
    rafRef.current = requestAnimationFrame(escanear);
  };

  const activar = async () => {
    setResultado(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      streamRef.current = stream;
      const video = videoRef.current;
      video.srcObject = stream;
      await video.play();
      activeRef.current = true; setActivo(true);
      escanear();
    } catch (e) { toast('❌ No se pudo acceder al Oráculo (cámara).', 'error'); }
  };

  const detener = () => {
    activeRef.current = false;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    streamRef.current = null;
    setActivo(false);
  };

  const procesar = async (raw) => {
    activeRef.current = false;
    const id = raw.indexOf(QR_PREFIX) === 0 ? raw.slice(QR_PREFIX.length) : raw.trim();
    try {
      const snap = await db.collection('pedidos').doc(id).get();
      if (!snap.exists) return setResultado({ tipo:'invalido', titulo:'❌ Pacto inexistente', msg:'Este código no existe en las tinieblas.' });
      const p = snap.data();
      if (p.estado === 'entregado') return setResultado({ tipo:'usada', titulo:'⚠️ Pacto ya consumado', msg:'Entregado el ' + fmtFecha(p.entregadoEl), p });
      if (p.estado === 'pendiente') return setResultado({ tipo:'pendiente', titulo:'⏳ Ofrenda pendiente', msg:'El pago aún no fue consagrado.', p });
      if (p.estado === 'rechazado') return setResultado({ tipo:'invalido', titulo:'❌ Ofrenda rechazada', msg:'El pacto fue roto.', p });
      await db.collection('pedidos').doc(id).update({ estado:'entregado', entregadoEl: firebase.firestore.FieldValue.serverTimestamp() });
      if (navigator.vibrate) navigator.vibrate(120);
      setResultado({ tipo:'ok', titulo:'✅ Pacto consumado', msg:'Alma entregada al inframundo.', p });
    } catch (e) {
      setResultado({ tipo:'invalido', titulo:'Error del Oráculo', msg:'Reintentá el escaneo.' });
    }
  };

  return (
    <div>
      <h3 className="section-title">🔮 Oráculo de Pactos</h3>
      <p className="hint">Escaneá el QR del pacto para validar y consumar la entrega.</p>
      <div className="scanner-box">
        <video ref={videoRef} playsInline muted className={'scanner-video' + (activo ? '' : ' hidden')}/>
        {!activo && !resultado && <div className="scanner-ph"><InvertedCross size={40}/><br/>El Oráculo se activará aquí</div>}
        {resultado && (
          <div className={'scan-result r-' + resultado.tipo}>
            <div className="scan-titulo">{resultado.titulo}</div>
            <div className="scan-msg">{resultado.msg}</div>
            {resultado.p && <div className="scan-det">{resultado.p.productoNombre} · {resultado.p.nombre} · DNI {resultado.p.dni}</div>}
          </div>
        )}
      </div>
      <canvas ref={canvasRef} style={{display:'none'}}/>
      {activo ? (
        <div>
          <button className="btn btn-primary" onClick={() => { setResultado(null); activeRef.current = true; escanear(); }}>🔁 Consultar otro</button>
          <button className="btn btn-ghost" onClick={detener}>Silenciar Oráculo</button>
        </div>
      ) : (
        <button className="btn btn-primary" onClick={activar}>🔮 Invocar Oráculo</button>
      )}
    </div>
  );
}

function App() {
  const [booting, setBooting] = useState(true);
  const [bootError, setBootError] = useState(false);
  const [user, setUser] = useState(null);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [tab, setTab] = useState('tienda');
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [todosPedidos, setTodosPedidos] = useState([]);
  const [comprando, setComprando] = useState(null);
  const [toasts, setToasts] = useState([]);

  const isAdmin = !!(user && ADMIN_EMAIL && user.email && user.email.toLowerCase() === String(ADMIN_EMAIL).toLowerCase());

  const toast = (msg, type) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type: type || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
  };

  useEffect(() => {
    if (!auth) { setBooting(false); return; }
    let done = false;
    const unsub = auth.onAuthStateChanged(u => { done = true; setUser(u); setBooting(false); });
    const t = setTimeout(() => { if (!done) setBootError(true); }, 10000);
    return () => { clearTimeout(t); unsub(); };
  }, []);

  useEffect(() => {
    if (!db) return;
    return db.collection('config').doc('store').onSnapshot(snap => {
      setConfig(Object.assign({}, DEFAULT_CONFIG, snap.exists ? snap.data() : {}));
    }, () => {});
  }, []);

  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--primary', config.primaryColor || '#dc2626');
    r.setProperty('--accent', config.accentColor || '#ef4444');
    document.title = config.title || 'BloodLucyfer';
  }, [config]);

  useEffect(() => {
    if (!db || !user) { setProductos([]); return; }
    return db.collection('productos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => (b.creadoEl || 0) - (a.creadoEl || 0));
      setProductos(arr);
    }, e => toast('Error al cargar artefactos: ' + e.message, 'error'));
  }, [user]);

  useEffect(() => {
    if (!db || !user) { setPedidos([]); return; }
    return db.collection('pedidos').where('userId', '==', user.uid).onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => tsNum(b.fecha) - tsNum(a.fecha));
      setPedidos(arr);
    }, () => {});
  }, [user]);

  useEffect(() => {
    if (!db || !isAdmin) { setTodosPedidos([]); return; }
    return db.collection('pedidos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => tsNum(b.fecha) - tsNum(a.fecha));
      setTodosPedidos(arr);
    }, () => {});
  }, [isAdmin]);

  useEffect(() => { if (!user) { setTab('tienda'); setComprando(null); } }, [user]);

  useEffect(() => {
    if (booting || !db) return;
    const params = new URLSearchParams(window.location.search);
    const ext = params.get('external_reference');
    const status = params.get('collection_status') || params.get('status');
    if (!ext || !status) return;
    window.history.replaceState({}, '', window.location.pathname);
    (async () => {
      try {
        const ref = db.collection('pedidos').doc(ext);
        const snap = await ref.get();
        if (!snap.exists) return;
        const p = snap.data();
        if (status === 'approved') {
          if (p.estado === 'pendiente' || p.estado === 'rechazado') {
            await ref.update({ estado: 'aprobado', pagadoEl: firebase.firestore.FieldValue.serverTimestamp() });
            if (p.productoId) {
              try {
                await db.runTransaction(async t => {
                  const pr = db.collection('productos').doc(p.productoId);
                  const ps = await t.get(pr);
                  if (ps.exists) t.update(pr, { stock: Math.max(0, (ps.data().stock || 1) - 1) });
                });
              } catch (e) {}
            }
          }
          toast('✅ ¡Ofrenda consagrada! Tu pacto está en Mis Pactos.', 'success');
          setTab('pedidos');
        } else if (status === 'pending' || status === 'in_process' || status === 'authorized') {
          toast('⏳ Ofrenda pendiente. Lo verás en Mis Pactos.', 'info');
          setTab('pedidos');
        } else {
          if (p.estado === 'pendiente') await ref.update({ estado: 'rechazado' });
          toast('❌ La ofrenda fue rechazada.', 'error');
        }
      } catch (e) { toast('No se pudo verificar el pago: ' + e.message, 'error'); }
    })();
  }, [booting]);

  const reintentarPago = async (pedido) => {
    try {
      toast('⏳ Generando nuevo ritual de pago…', 'info');
      const pref = await crearPreferencia(buildPreferencia({
        titulo: pedido.productoNombre, precio: pedido.precio, ref: pedido.id,
        nombre: pedido.nombre, dni: pedido.dni, email: user.email, config
      }));
      const url = pref.init_point || pref.sandbox_init_point;
      if (!url) throw new Error('Sin link de pago.');
      window.location.href = url;
    } catch (e) { toast('❌ ' + e.message, 'error'); }
  };

  if (!CREDS_OK || FB_ERROR || !auth) return (<><CredsScreen fbError={FB_ERROR}/><Toasts toasts={toasts}/></>);
  if (booting) return (<><Splash error={bootError}/><Toasts toasts={toasts}/></>);
  if (!user) return (<><Login config={config}/><Toasts toasts={toasts}/></>);

  return (
    <>
      <VortexBackground/>
      <Header user={user} config={config} isAdmin={isAdmin}/>
      <main className="app">
        {config.banner && <div className="banner">📣 {config.banner}</div>}
        {tab === 'tienda' && <TiendaView productos={productos} config={config} onComprar={setComprando} toast={toast}/>}
        {tab === 'pedidos' && <PedidosView pedidos={pedidos} config={config} onPagar={reintentarPago}/>}
        {tab === 'admin' && isAdmin && <AdminView config={config} productos={productos} pedidos={todosPedidos} toast={toast}/>}
        {tab === 'scanner' && isAdmin && <ScannerView toast={toast}/>}
      </main>
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin}/>
      {comprando && <CompraModal producto={comprando} config={config} user={user} onClose={() => setComprando(null)} toast={toast}/>}
      <Toasts toasts={toasts}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
window.__APP_RENDERED__ = true;
</script>
</body>
</html>
